<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Click4Tech Solutions</title>
<style>
  :root{
    --bg:#FAF3E6; --card:#FFFFFF; --navy:#132A4E; --navy-soft:#3C577F;
    --orange:#F07D1E; --orange-deep:#C6600F; --orange-tint:#FCE9D4;
    --text-dim:#5C6B80; --line:rgba(19,42,78,0.14); --mint:#1F9D6F; --danger:#C6392F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;font-size:0.92rem;}
  #wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px 32px;max-width:380px;width:100%;box-shadow:0 12px 30px rgba(19,42,78,0.08);}
  .box .brand{margin-bottom:18px;}
  .box .brand img{height:34px;width:auto;display:block;}
  .box h1{font-size:1.2rem;margin:0 0 6px;}
  .box p.sub{color:var(--text-dim);font-size:0.85rem;margin:0 0 18px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:0.78rem;font-weight:700;color:var(--navy-soft);margin-bottom:5px;}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;}
  .primary-btn{width:100%;padding:11px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;font-weight:700;font-size:0.95rem;margin-top:4px;}
  .primary-btn:disabled{opacity:0.6;}
  .msg{font-size:0.85rem;margin-top:12px;padding:10px 12px;border-radius:8px;display:none;}
  .msg.error{background:rgba(198,57,47,0.09);color:var(--danger);display:block;}
  .msg.success{background:rgba(31,157,111,0.1);color:var(--mint);display:block;}
</style>
</head>
<body>
<div id="wrap">
  <div class="box">
    <div class="brand"><img src="assets/click4tech-logo.png" alt="Click4Tech Solutions"></div>
    <h1>Set a new password</h1>
    <p class="sub" id="subText">Enter a new password for your support portal account.</p>
    <div class="field"><label>New password</label><input id="pw1" type="password" placeholder="At least 6 characters"></div>
    <div class="field"><label>Confirm password</label><input id="pw2" type="password" placeholder="Repeat password"></div>
    <button class="primary-btn" id="saveBtn">Save New Password</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/support-config.js"></script>
<script>
(function(){
  'use strict';
  var sb = window.supabase.createClient(window.C4T_SUPABASE_URL, window.C4T_SUPABASE_ANON_KEY);
  var msgEl = document.getElementById('msg');

  function showMsg(text, isError){
    msgEl.textContent = text;
    msgEl.className = 'msg ' + (isError ? 'error' : 'success');
  }

  // Supabase's password-reset email links here with a recovery token in
  // the URL; supabase-js reads it automatically and fires this event once
  // it has established a temporary "recovery" session.
  var ready = false;
  sb.auth.onAuthStateChange(function(event){
    if (event === 'PASSWORD_RECOVERY') ready = true;
  });
  // Fallback: if a session already exists (e.g. link opened twice), allow it too.
  sb.auth.getSession().then(function(res){
    if (res.data && res.data.session) ready = true;
  });

  document.getElementById('saveBtn').addEventListener('click', function(){
    var btn = this;
    var pw1 = document.getElementById('pw1').value;
    var pw2 = document.getElementById('pw2').value;
    if (!pw1 || pw1.length < 6) { showMsg('Password must be at least 6 characters.', true); return; }
    if (pw1 !== pw2) { showMsg('Passwords do not match.', true); return; }
    if (!ready) { showMsg('This reset link looks invalid or expired. Request a new one from the login page.', true); return; }

    btn.disabled = true; btn.textContent = 'Saving…';
    sb.auth.updateUser({ password: pw1 }).then(function(res){
      btn.disabled = false; btn.textContent = 'Save New Password';
      if (res.error) { showMsg(res.error.message, true); return; }
      showMsg('Password updated! Redirecting to the portal…', false);
      setTimeout(function(){ window.location.href = 'support.html'; }, 1500);
    });
  });
})();
</script>
</body>
</html>
