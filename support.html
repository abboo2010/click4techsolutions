<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Support Portal — Click4Tech Solutions</title>
<style>
  :root{
    --bg:#FAF3E6; --card:#FFFFFF; --navy:#132A4E; --navy-soft:#3C577F;
    --orange:#F07D1E; --orange-deep:#C6600F; --orange-tint:#FCE9D4;
    --text-dim:#5C6B80; --line:rgba(19,42,78,0.14); --mint:#1F9D6F; --danger:#C6392F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:var(--orange-deep);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:0.92rem;}

  #loadingScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:0.9rem;}

  /* ---------- auth screen (login / signup) ---------- */
  #wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px 32px;max-width:380px;width:100%;box-shadow:0 12px 30px rgba(19,42,78,0.08);}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px;}
  .brand img{height:51px;width:auto;display:block;}

  .box h1{font-size:1.25rem;margin:0 0 4px;}
  .box p.sub{color:var(--text-dim);font-size:0.85rem;margin:0 0 18px;}

  .tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--bg);border-radius:9px;padding:4px;}
  .tabs button{flex:1;padding:8px;border:none;border-radius:6px;background:transparent;color:var(--navy-soft);font-weight:700;font-size:0.85rem;}
  .tabs button.active{background:var(--card);color:var(--orange-deep);box-shadow:0 2px 6px rgba(19,42,78,0.08);}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:0.78rem;font-weight:700;color:var(--navy-soft);margin-bottom:5px;}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;}

  .primary-btn{width:100%;padding:11px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;font-weight:700;font-size:0.95rem;margin-top:4px;}
  .primary-btn:disabled{opacity:0.6;cursor:default;}

  .msg{font-size:0.85rem;margin-top:12px;padding:10px 12px;border-radius:8px;display:none;}
  .msg.error{background:rgba(198,57,47,0.09);color:var(--danger);display:block;}
  .msg.success{background:rgba(31,157,111,0.1);color:var(--mint);display:block;}

  .forgot-link{display:block;text-align:center;margin-top:14px;font-size:0.82rem;color:var(--navy-soft);text-decoration:none;}
  .forgot-link:hover{color:var(--orange-deep);}

  .back-home{display:block;text-align:center;margin-top:18px;font-size:0.8rem;color:var(--text-dim);text-decoration:none;}
  .back-home:hover{color:var(--orange-deep);}

  /* generic show/hide panel used by BOTH the auth screen (login/signup) and
     the app screen (ticket list/thread) — same visual language, different
     contexts, no collisions since each panel's parent container is only
     ever one or the other. */
  .panel{display:none;}
  .panel.active{display:block;}

  /* ---------- app screen (ticket portal) ---------- */
  #app{min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .topbar .brand-row{display:flex;align-items:center;gap:12px;}
  .topbar .logo-chip{background:#fff;border-radius:7px;padding:6px 10px;display:flex;align-items:center;}
  .topbar .logo-chip img{height:45px;width:auto;display:block;}
  .topbar h1{font-size:1.05rem;margin:0;font-weight:700;}
  .topbar .sub{font-size:0.78rem;color:rgba(255,255,255,0.65);}
  .logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;padding:7px 14px;border-radius:7px;font-size:0.82rem;}
  .logout-btn:hover{background:rgba(255,255,255,0.1);}

  main{max-width:760px;margin:0 auto;padding:24px 20px 80px;}

  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .head-row h2{margin:0;font-size:1.2rem;}
  .btn{padding:9px 18px;border-radius:8px;border:none;font-weight:700;font-size:0.85rem;}
  .btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--navy-soft);}
  .btn-sm{padding:6px 11px;font-size:0.78rem;}

  .empty-state{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--text-dim);font-size:0.9rem;}

  .ticket-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s ease;}
  .ticket-card:hover{box-shadow:0 6px 16px rgba(19,42,78,0.08);}
  .ticket-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .ticket-num{font-weight:700;color:var(--text-dim);margin-right:6px;}
  .ticket-subject{font-weight:700;font-size:0.95rem;}
  .ticket-meta{font-size:0.78rem;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap;}

  .badge{font-size:0.7rem;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .badge.status-open{background:var(--orange-tint);color:var(--orange-deep);}
  .badge.status-in_progress{background:#E4ECFB;color:#2E4E9E;}
  .badge.status-resolved{background:rgba(31,157,111,0.12);color:var(--mint);}
  .badge.status-closed{background:var(--line);color:var(--text-dim);}
  .badge.priority-low{background:#E4ECFB;color:#2E4E9E;}
  .badge.priority-medium{background:var(--orange-tint);color:var(--orange-deep);}
  .badge.priority-high{background:rgba(198,57,47,0.12);color:var(--danger);}

  /* new ticket form */
  .form-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .form-card .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .form-card .field label{font-size:0.8rem;font-weight:700;color:var(--navy-soft);}
  .form-card .field input,.form-card .field textarea,.form-card .field select{padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--navy);}
  .form-card .field textarea{resize:vertical;min-height:90px;}
  .form-card .field input[readonly]{background:var(--bg);color:var(--text-dim);cursor:default;}
  .form-card .field-hint{font-size:0.74rem;color:var(--text-dim);margin-top:-2px;}
  .form-card .field input[type="file"]{padding:7px 8px;background:#fff;}
  .form-actions{display:flex;justify-content:flex-end;gap:8px;}

  .attachment-link{margin-top:8px;}
  .attachment-link a{display:inline-flex;align-items:center;gap:5px;font-size:0.8rem;font-weight:700;text-decoration:none;}
  .msg-bubble.client .attachment-link a{color:#fff;text-decoration:underline;}
  .msg-bubble.admin .attachment-link a{color:var(--orange-deep);text-decoration:underline;}

  /* thread view */
  .thread-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .thread-head button.back{background:transparent;border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--navy-soft);font-size:0.8rem;}
  .thread-num{font-size:0.8rem;font-weight:700;color:var(--text-dim);margin-top:10px;}
  .thread-subject{font-size:1.1rem;font-weight:700;margin:2px 0 4px;}
  .thread-meta{font-size:0.8rem;color:var(--text-dim);margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  .messages{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
  .msg-bubble{max-width:80%;padding:12px 14px;border-radius:12px;font-size:0.88rem;line-height:1.5;}
  .msg-bubble .who{font-size:0.72rem;font-weight:700;margin-bottom:4px;opacity:0.75;}
  .msg-bubble .when{font-size:0.68rem;opacity:0.6;margin-top:6px;}
  .msg-bubble.client{align-self:flex-end;background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;border-bottom-right-radius:3px;}
  .msg-bubble.admin{align-self:flex-start;background:var(--card);border:1px solid var(--line);color:var(--navy);border-bottom-left-radius:3px;}

  .reply-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .reply-box textarea{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;resize:vertical;}
  .reply-actions{display:flex;justify-content:flex-end;}
  .closed-note{font-size:0.85rem;color:var(--text-dim);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px;text-align:center;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:0.85rem;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:100;}
  .toast.show{opacity:1;}
  .toast.error{background:var(--danger);}
</style>
</head>
<body>

<div id="loadingScreen">Loading…</div>

<!-- ===================== AUTH SCREEN (login / signup) ===================== -->
<div id="authScreen" style="display:none;">
  <div id="wrap">
    <div class="box">
      <div class="brand"><img src="assets/click4tech-logo.png" alt="Click4Tech Solutions"></div>
      <h1>Client Support Portal</h1>
      <p class="sub">Log in to submit and track your support tickets.</p>

      <div class="tabs">
        <button id="tabLoginBtn" class="active">Log In</button>
        <button id="tabSignupBtn">Sign Up</button>
      </div>

      <!-- LOG IN -->
      <div id="panelLogin" class="panel active">
        <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="you@company.com"></div>
        <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div>
        <button class="primary-btn" id="loginBtn">Log In</button>
        <div class="msg" id="loginMsg"></div>
        <a class="forgot-link" id="forgotLink" href="#">Forgot your password?</a>
      </div>

      <!-- SIGN UP -->
      <div id="panelSignup" class="panel">
        <div class="field"><label>Full name</label><input id="suName" type="text" placeholder="Your name"></div>
        <div class="field"><label>Company name (optional)</label><input id="suCompany" type="text" placeholder="Your company"></div>
        <div class="field"><label>Email</label><input id="suEmail" type="email" autocomplete="username" placeholder="you@company.com"></div>
        <div class="field"><label>Password</label><input id="suPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
        <div class="field"><label>Confirm password</label><input id="suPassword2" type="password" autocomplete="new-password" placeholder="Repeat password"></div>
        <button class="primary-btn" id="signupBtn">Create Account</button>
        <div class="msg" id="signupMsg"></div>
      </div>

      <a class="back-home" href="/">&larr; Back to click4techsolutions.com</a>
    </div>
  </div>
</div>

<!-- ===================== APP SCREEN (ticket portal) ===================== -->
<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand-row">
      <div class="logo-chip"><img src="assets/click4tech-logo-mark.png" alt="Click4Tech Solutions"></div>
      <div>
        <h1>Client Support Portal</h1>
        <div class="sub" id="whoami"></div>
      </div>
    </div>
    <button class="logout-btn" id="logoutBtn">Log Out</button>
  </div>

  <main>
    <!-- LIST VIEW -->
    <div id="panelList" class="panel active">
      <div class="head-row">
        <h2>Your Tickets</h2>
        <button class="btn btn-primary" id="newTicketBtn">+ New Ticket</button>
      </div>

      <div class="form-card" id="newTicketForm" style="display:none;">
        <div class="field">
          <label>Name</label>
          <input id="ntName" type="text" readonly>
        </div>
        <div class="field">
          <label>Email Address</label>
          <input id="ntEmail" type="text" readonly>
        </div>
        <div class="field">
          <label>What's this about?</label>
          <select id="ntCategory">
            <option value="email_creation">Email creation</option>
            <option value="email_login">Email login problem</option>
            <option value="forgotten_password">Forgotten password</option>
            <option value="website_hosting">Website / hosting issue</option>
            <option value="general">General / other</option>
          </select>
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="ntPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label>Subject</label>
          <input id="ntSubject" type="text" placeholder="Short summary, e.g. 'Can't log into my email'">
        </div>
        <div class="field">
          <label>Message</label>
          <textarea id="ntMessage" placeholder="Describe the issue — include any error messages you're seeing."></textarea>
        </div>
        <div class="field">
          <label>Attachment (optional)</label>
          <input id="ntAttachment" type="file" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.txt,.doc,.docx">
          <div class="field-hint">Screenshot, PDF, Word doc, or text file — max 5MB.</div>
        </div>
        <div class="form-actions">
          <button class="btn btn-ghost" id="ntCancelBtn">Cancel</button>
          <button class="btn btn-primary" id="ntSubmitBtn">Submit Ticket</button>
        </div>
      </div>

      <div id="ticketList"></div>
      <div class="empty-state" id="emptyState" style="display:none;">You haven't submitted any tickets yet.</div>
    </div>

    <!-- THREAD VIEW -->
    <div id="panelThread" class="panel">
      <div class="thread-head">
        <button class="back" id="backBtn">&larr; Back to tickets</button>
      </div>
      <div class="thread-num" id="threadNum"></div>
      <div class="thread-subject" id="threadSubject"></div>
      <div class="thread-meta">
        <span class="badge" id="threadStatusBadge"></span>
        <span class="badge" id="threadPriorityBadge"></span>
        <span id="threadCategory"></span>
      </div>

      <div class="messages" id="messagesList"></div>

      <div id="replyArea"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/support-config.js"></script>
<script>
(function(){
  'use strict';

  var sb = window.supabase.createClient(window.C4T_SUPABASE_URL, window.C4T_SUPABASE_ANON_KEY);
  var LIST_API = '/.netlify/functions/ticket-list';
  var CREATE_API = '/.netlify/functions/ticket-create';
  var THREAD_API = '/.netlify/functions/ticket-thread';
  var REPLY_API = '/.netlify/functions/ticket-reply';

  var CATEGORY_LABELS = {
    email_creation: 'Email creation',
    email_login: 'Email login problem',
    forgotten_password: 'Forgotten password',
    website_hosting: 'Website / hosting issue',
    general: 'General / other'
  };
  var STATUS_LABELS = { open: 'Open', in_progress: 'In Progress', resolved: 'Resolved', closed: 'Closed' };
  var PRIORITY_LABELS = { low: 'Low', medium: 'Medium', high: 'High' };
  var MAX_ATTACHMENT_BYTES = 5 * 1024 * 1024;

  var currentUser = null;
  var currentTicketId = null;

  function toast(msg, isError){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  function fmtDate(iso){
    try {
      var d = new Date(iso);
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ============================================================
  // Screen switching — everything happens on this one page now;
  // logging in/out just swaps which screen is visible, no navigation.
  // ============================================================
  function showAuthScreen(){
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('authScreen').style.display = 'block';
    // Reset the auth forms back to a clean "Log In" state each time.
    document.getElementById('tabLoginBtn').click();
    document.getElementById('loginMsg').className = 'msg';
    document.getElementById('signupMsg').className = 'msg';
  }

  function showAppScreen(user){
    currentUser = user;
    var name = (user.user_metadata && user.user_metadata.full_name) || user.email;
    document.getElementById('whoami').textContent = name + ' (' + user.email + ')';
    document.getElementById('ntName').value = name;
    document.getElementById('ntEmail').value = user.email;

    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    showPanel('list');
    document.getElementById('newTicketForm').style.display = 'none';
    loadTickets();
  }

  // ---------------- Auth screen wiring ----------------
  var tabLoginBtn = document.getElementById('tabLoginBtn');
  var tabSignupBtn = document.getElementById('tabSignupBtn');
  var panelLogin = document.getElementById('panelLogin');
  var panelSignup = document.getElementById('panelSignup');

  tabLoginBtn.addEventListener('click', function(){
    tabLoginBtn.classList.add('active'); tabSignupBtn.classList.remove('active');
    panelLogin.classList.add('active'); panelSignup.classList.remove('active');
  });
  tabSignupBtn.addEventListener('click', function(){
    tabSignupBtn.classList.add('active'); tabLoginBtn.classList.remove('active');
    panelSignup.classList.add('active'); panelLogin.classList.remove('active');
  });

  function showMsg(el, text, isError){
    el.textContent = text;
    el.className = 'msg ' + (isError ? 'error' : 'success');
  }

  document.getElementById('loginBtn').addEventListener('click', function(){
    var btn = this;
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var msgEl = document.getElementById('loginMsg');
    msgEl.className = 'msg';
    if (!email || !password) { showMsg(msgEl, 'Enter your email and password.', true); return; }

    btn.disabled = true; btn.textContent = 'Logging in…';
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      btn.disabled = false; btn.textContent = 'Log In';
      if (res.error) { showMsg(msgEl, res.error.message, true); return; }
      showAppScreen(res.data.session.user);
    });
  });

  document.getElementById('signupBtn').addEventListener('click', function(){
    var btn = this;
    var name = document.getElementById('suName').value.trim();
    var company = document.getElementById('suCompany').value.trim();
    var email = document.getElementById('suEmail').value.trim();
    var password = document.getElementById('suPassword').value;
    var password2 = document.getElementById('suPassword2').value;
    var msgEl = document.getElementById('signupMsg');
    msgEl.className = 'msg';

    if (!name || !email || !password) { showMsg(msgEl, 'Name, email, and password are required.', true); return; }
    if (password.length < 6) { showMsg(msgEl, 'Password must be at least 6 characters.', true); return; }
    if (password !== password2) { showMsg(msgEl, 'Passwords do not match.', true); return; }

    btn.disabled = true; btn.textContent = 'Creating account…';
    sb.auth.signUp({
      email: email,
      password: password,
      options: {
        data: { full_name: name, company_name: company || null },
        emailRedirectTo: window.location.origin + '/support.html'
      }
    }).then(function(res){
      btn.disabled = false; btn.textContent = 'Create Account';
      if (res.error) { showMsg(msgEl, res.error.message, true); return; }
      if (res.data && res.data.session) {
        // Email confirmation is off — the account is already active and logged in.
        showAppScreen(res.data.session.user);
        return;
      }
      showMsg(msgEl, 'Account created! Check your email to confirm your address, then log in.', false);
    });
  });

  document.getElementById('forgotLink').addEventListener('click', function(e){
    e.preventDefault();
    var email = document.getElementById('loginEmail').value.trim();
    var msgEl = document.getElementById('loginMsg');
    if (!email) { showMsg(msgEl, 'Enter your email above first, then click "Forgot your password?" again.', true); return; }
    sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/support-reset-password.html'
    }).then(function(res){
      if (res.error) { showMsg(msgEl, res.error.message, true); return; }
      showMsg(msgEl, 'Password reset link sent — check your email.', false);
    });
  });

  // ---------------- Ticket portal (app screen) ----------------
  async function authedFetch(url, opts){
    opts = opts || {};
    var sessionRes = await sb.auth.getSession();
    var session = sessionRes.data && sessionRes.data.session;
    if (!session) { showAuthScreen(); return null; }
    opts.headers = Object.assign({}, opts.headers, {
      'Authorization': 'Bearer ' + session.access_token,
      'Content-Type': 'application/json'
    });
    var res = await fetch(url, opts);
    if (res.status === 401) { await sb.auth.signOut(); showAuthScreen(); return null; }
    return res;
  }

  function showPanel(name){
    document.getElementById('panelList').classList.toggle('active', name === 'list');
    document.getElementById('panelThread').classList.toggle('active', name === 'thread');
  }

  async function loadTickets(){
    var res = await authedFetch(LIST_API);
    if (!res) return;
    var data = await res.json();
    if (!res.ok) { toast(data.error || 'Failed to load tickets', true); return; }
    renderTicketList(data.tickets || []);
  }

  function renderTicketList(tickets){
    var listEl = document.getElementById('ticketList');
    var emptyEl = document.getElementById('emptyState');
    listEl.innerHTML = '';
    if (tickets.length === 0) { emptyEl.style.display = 'block'; return; }
    emptyEl.style.display = 'none';

    tickets.forEach(function(t){
      var card = document.createElement('div');
      card.className = 'ticket-card';
      card.innerHTML =
        '<div class="ticket-top">' +
          '<div class="ticket-subject"><span class="ticket-num">#' + esc(t.ticket_number) + '</span>' + esc(t.subject) + '</div>' +
          '<span class="badge status-' + esc(t.status) + '">' + esc(STATUS_LABELS[t.status] || t.status) + '</span>' +
        '</div>' +
        '<div class="ticket-meta">' +
          '<span class="badge priority-' + esc(t.priority || 'medium') + '">' + esc(PRIORITY_LABELS[t.priority] || 'Medium') + '</span>' +
          '<span>' + esc(CATEGORY_LABELS[t.category] || t.category) + '</span>' +
          '<span>&middot; Updated ' + esc(fmtDate(t.updated_at)) + '</span>' +
        '</div>';
      card.addEventListener('click', function(){ openThread(t.id); });
      listEl.appendChild(card);
    });
  }

  function readFileAsBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(',')[1] || ''); };
      reader.onerror = function(){ reject(new Error('Could not read file')); };
      reader.readAsDataURL(file);
    });
  }

  function resetNewTicketForm(){
    document.getElementById('newTicketForm').style.display = 'none';
    document.getElementById('ntSubject').value = '';
    document.getElementById('ntMessage').value = '';
    document.getElementById('ntPriority').value = 'medium';
    document.getElementById('ntAttachment').value = '';
  }

  document.getElementById('newTicketBtn').addEventListener('click', function(){
    var form = document.getElementById('newTicketForm');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('ntCancelBtn').addEventListener('click', resetNewTicketForm);
  document.getElementById('ntSubmitBtn').addEventListener('click', async function(){
    var btn = this;
    var category = document.getElementById('ntCategory').value;
    var priority = document.getElementById('ntPriority').value;
    var subject = document.getElementById('ntSubject').value.trim();
    var message = document.getElementById('ntMessage').value.trim();
    var fileInput = document.getElementById('ntAttachment');
    var file = fileInput.files && fileInput.files[0];
    if (!subject || !message) { toast('Please fill in a subject and details.', true); return; }
    if (file && file.size > MAX_ATTACHMENT_BYTES) { toast('That file is too large — max 5MB.', true); return; }

    btn.disabled = true; btn.textContent = 'Submitting…';

    var payload = { category: category, priority: priority, subject: subject, message: message };
    if (file) {
      try {
        payload.attachment = { name: file.name, type: file.type || 'application/octet-stream', data: await readFileAsBase64(file) };
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Submit Ticket';
        toast('Could not read the attached file. Try again or submit without it.', true);
        return;
      }
    }

    var res = await authedFetch(CREATE_API, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    btn.disabled = false; btn.textContent = 'Submit Ticket';
    if (!res) return;
    var data = await res.json();
    if (!res.ok) { toast(data.error || 'Failed to submit ticket', true); return; }

    resetNewTicketForm();
    toast('Ticket submitted!');
    loadTickets();
  });

  async function openThread(id){
    currentTicketId = id;
    var res = await authedFetch(THREAD_API + '?id=' + encodeURIComponent(id));
    if (!res) return;
    var data = await res.json();
    if (!res.ok) { toast(data.error || 'Failed to load ticket', true); return; }
    renderThread(data.ticket, data.messages || []);
    showPanel('thread');
  }

  function renderThread(ticket, messages){
    document.getElementById('threadNum').textContent = '#' + ticket.ticket_number;
    document.getElementById('threadSubject').textContent = ticket.subject;
    var badge = document.getElementById('threadStatusBadge');
    badge.textContent = STATUS_LABELS[ticket.status] || ticket.status;
    badge.className = 'badge status-' + ticket.status;
    var pBadge = document.getElementById('threadPriorityBadge');
    pBadge.textContent = PRIORITY_LABELS[ticket.priority] || 'Medium';
    pBadge.className = 'badge priority-' + (ticket.priority || 'medium');
    document.getElementById('threadCategory').textContent = CATEGORY_LABELS[ticket.category] || ticket.category;

    var msgsEl = document.getElementById('messagesList');
    msgsEl.innerHTML = '';
    messages.forEach(function(m){
      var bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + (m.sender_type === 'admin' ? 'admin' : 'client');
      var attachmentHtml = m.attachment_url
        ? '<div class="attachment-link"><a href="' + esc(m.attachment_url) + '" target="_blank" rel="noopener">📎 ' + esc(m.attachment_name || 'Attachment') + '</a></div>'
        : '';
      bubble.innerHTML =
        '<div class="who">' + (m.sender_type === 'admin' ? 'Click4Tech Support' : esc(m.sender_name || 'You')) + '</div>' +
        '<div>' + esc(m.body).replace(/\n/g, '<br>') + '</div>' +
        attachmentHtml +
        '<div class="when">' + esc(fmtDate(m.created_at)) + '</div>';
      msgsEl.appendChild(bubble);
    });

    var replyArea = document.getElementById('replyArea');
    if (ticket.status === 'closed') {
      replyArea.innerHTML = '<div class="closed-note">This ticket is closed. Please submit a new ticket if you need further help.</div>';
    } else {
      replyArea.innerHTML =
        '<div class="reply-box">' +
          '<textarea id="replyText" placeholder="Type your reply…"></textarea>' +
          '<div class="reply-actions"><button class="btn btn-primary btn-sm" id="replySendBtn">Send Reply</button></div>' +
        '</div>';
      document.getElementById('replySendBtn').addEventListener('click', sendReply);
    }
  }

  async function sendReply(){
    var btn = this;
    var text = document.getElementById('replyText').value.trim();
    if (!text) { toast('Type a reply first.', true); return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    var res = await authedFetch(REPLY_API, {
      method: 'POST',
      body: JSON.stringify({ ticket_id: currentTicketId, message: text })
    });
    btn.disabled = false; btn.textContent = 'Send Reply';
    if (!res) return;
    var data = await res.json();
    if (!res.ok) { toast(data.error || 'Failed to send reply', true); return; }
    openThread(currentTicketId);
  }

  document.getElementById('backBtn').addEventListener('click', function(){
    showPanel('list');
    loadTickets();
  });

  document.getElementById('logoutBtn').addEventListener('click', async function(){
    await sb.auth.signOut();
    showAuthScreen();
  });

  // ---------------- Boot ----------------
  (async function boot(){
    var sessionRes = await sb.auth.getSession();
    var session = sessionRes.data && sessionRes.data.session;
    if (session) {
      showAppScreen(session.user);
    } else {
      showAuthScreen();
    }
  })();
})();
</script>
</body>
</html>
