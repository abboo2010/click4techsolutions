<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support Admin — Click4Tech Solutions</title>
<style>
  :root{
    --bg:#FAF3E6; --card:#FFFFFF; --navy:#132A4E; --navy-soft:#3C577F;
    --orange:#F07D1E; --orange-deep:#C6600F; --orange-tint:#FCE9D4;
    --text-dim:#5C6B80; --line:rgba(19,42,78,0.14); --mint:#1F9D6F; --danger:#C6392F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:var(--orange-deep);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:0.92rem;}

  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px 32px;max-width:360px;width:100%;box-shadow:0 12px 30px rgba(19,42,78,0.08);}
  .login-box .brand{margin-bottom:18px;}
  .login-box .brand img{height:34px;width:auto;display:block;}
  .login-box h1{font-size:1.3rem;margin:0 0 6px;}
  .login-box p{color:var(--text-dim);font-size:0.88rem;margin:0 0 20px;}
  .login-box input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;}
  .login-box button{width:100%;padding:11px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;font-weight:700;font-size:0.95rem;}
  .login-error{color:var(--danger);font-size:0.85rem;margin-top:8px;display:none;}

  #app{display:none;min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .topbar .brand-row{display:flex;align-items:center;gap:12px;}
  .topbar .logo-chip{background:#fff;border-radius:7px;padding:6px 10px;display:flex;align-items:center;}
  .topbar .logo-chip img{height:30px;width:auto;display:block;}
  .topbar h1{font-size:1.05rem;margin:0;font-weight:700;}
  .topbar .sub{font-size:0.78rem;color:rgba(255,255,255,0.65);}
  .logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;padding:7px 14px;border-radius:7px;font-size:0.82rem;}
  .logout-btn:hover{background:rgba(255,255,255,0.1);}

  .filters{display:flex;gap:6px;flex-wrap:wrap;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:9;align-items:center;}
  .filter-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--navy-soft);font-size:0.84rem;font-weight:600;}
  .filter-btn.active{background:var(--orange-tint);border-color:var(--orange);color:var(--orange-deep);}
  .filters select{margin-left:auto;padding:8px 10px;border-radius:8px;border:1px solid var(--line);}

  main{max-width:820px;margin:0 auto;padding:24px 20px 80px;}
  .panel{display:none;}
  .panel.active{display:block;}

  .empty-state{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--text-dim);font-size:0.9rem;}

  .ticket-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s ease;}
  .ticket-card:hover{box-shadow:0 6px 16px rgba(19,42,78,0.08);}
  .ticket-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .ticket-subject{font-weight:700;font-size:0.95rem;}
  .ticket-who{font-size:0.82rem;color:var(--navy-soft);margin-bottom:4px;}
  .ticket-meta{font-size:0.78rem;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap;}

  .badge{font-size:0.7rem;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .badge.status-open{background:var(--orange-tint);color:var(--orange-deep);}
  .badge.status-in_progress{background:#E4ECFB;color:#2E4E9E;}
  .badge.status-resolved{background:rgba(31,157,111,0.12);color:var(--mint);}
  .badge.status-closed{background:var(--line);color:var(--text-dim);}
  .badge.priority-low{background:#E4ECFB;color:#2E4E9E;}
  .badge.priority-medium{background:var(--orange-tint);color:var(--orange-deep);}
  .badge.priority-high{background:rgba(198,57,47,0.12);color:var(--danger);}

  .thread-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  .thread-head button.back{background:transparent;border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--navy-soft);font-size:0.8rem;}
  .thread-head-controls{display:flex;gap:8px;flex-wrap:wrap;}
  .status-select,.priority-select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font-size:0.82rem;font-weight:700;}

  .attachment-link{margin-top:8px;}
  .attachment-link a{display:inline-flex;align-items:center;gap:5px;font-size:0.8rem;font-weight:700;color:var(--orange-deep);text-decoration:underline;}

  .thread-subject{font-size:1.1rem;font-weight:700;margin:10px 0 4px;}
  .thread-meta{font-size:0.8rem;color:var(--text-dim);margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  .messages{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
  .msg-bubble{max-width:80%;padding:12px 14px;border-radius:12px;font-size:0.88rem;line-height:1.5;}
  .msg-bubble .who{font-size:0.72rem;font-weight:700;margin-bottom:4px;opacity:0.75;}
  .msg-bubble .when{font-size:0.68rem;opacity:0.6;margin-top:6px;}
  .msg-bubble.admin{align-self:flex-end;background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;border-bottom-right-radius:3px;}
  .msg-bubble.client{align-self:flex-start;background:var(--card);border:1px solid var(--line);color:var(--navy);border-bottom-left-radius:3px;}

  .reply-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .reply-box textarea{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;resize:vertical;}
  .reply-actions{display:flex;justify-content:flex-end;}
  .btn{padding:9px 18px;border-radius:8px;border:none;font-weight:700;font-size:0.85rem;}
  .btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;}
  .btn-sm{padding:6px 11px;font-size:0.78rem;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:0.85rem;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:100;}
  .toast.show{opacity:1;}
  .toast.error{background:var(--danger);}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="brand"><img src="assets/click4tech-logo.png" alt="Click4Tech Solutions"></div>
    <h1>Support Admin</h1>
    <p>Enter the admin password to manage client support tickets.</p>
    <input id="passwordInput" type="password" placeholder="Admin password" autocomplete="current-password">
    <button id="loginBtn">Log In</button>
    <div class="login-error" id="loginError">Wrong password. Try again.</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand-row">
      <div class="logo-chip"><img src="assets/click4tech-logo-mark.png" alt="Click4Tech Solutions"></div>
      <div>
        <h1>Client Support — Admin</h1>
        <div class="sub">click4techsolutions.com support tickets</div>
      </div>
    </div>
    <button class="logout-btn" id="logoutBtn">Log Out</button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-status="">All</button>
    <button class="filter-btn" data-status="open">Open</button>
    <button class="filter-btn" data-status="in_progress">In Progress</button>
    <button class="filter-btn" data-status="resolved">Resolved</button>
    <button class="filter-btn" data-status="closed">Closed</button>
    <select id="categoryFilter">
      <option value="">All categories</option>
      <option value="email_creation">Email creation</option>
      <option value="email_login">Email login problem</option>
      <option value="forgotten_password">Forgotten password</option>
      <option value="website_hosting">Website / hosting issue</option>
      <option value="general">General / other</option>
    </select>
    <select id="priorityFilter">
      <option value="">All priorities</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </div>

  <main>
    <div id="panelList" class="panel active">
      <div id="ticketList"></div>
      <div class="empty-state" id="emptyState" style="display:none;">No tickets match this filter.</div>
    </div>

    <div id="panelThread" class="panel">
      <div class="thread-head">
        <button class="back" id="backBtn">&larr; Back to tickets</button>
        <div class="thread-head-controls">
          <select class="priority-select" id="prioritySelect">
            <option value="low">Low priority</option>
            <option value="medium">Medium priority</option>
            <option value="high">High priority</option>
          </select>
          <select class="status-select" id="statusSelect">
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>
      <div class="thread-subject" id="threadSubject"></div>
      <div class="thread-meta" id="threadMeta"></div>

      <div class="messages" id="messagesList"></div>

      <div class="reply-box">
        <textarea id="replyText" placeholder="Type your reply to the client…"></textarea>
        <div class="reply-actions"><button class="btn btn-primary btn-sm" id="replySendBtn">Send Reply</button></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var LIST_API = '/.netlify/functions/ticket-list';
  var THREAD_API = '/.netlify/functions/ticket-thread';
  var REPLY_API = '/.netlify/functions/ticket-reply';
  var STATUS_API = '/.netlify/functions/ticket-status';
  var PW_KEY = 'c4t_support_admin_pw';

  var CATEGORY_LABELS = {
    email_creation: 'Email creation',
    email_login: 'Email login problem',
    forgotten_password: 'Forgotten password',
    website_hosting: 'Website / hosting issue',
    general: 'General / other'
  };
  var STATUS_LABELS = { open: 'Open', in_progress: 'In Progress', resolved: 'Resolved', closed: 'Closed' };
  var PRIORITY_LABELS = { low: 'Low', medium: 'Medium', high: 'High' };

  var currentStatusFilter = '';
  var currentCategoryFilter = '';
  var currentPriorityFilter = '';
  var currentTicketId = null;

  function toast(msg, isError){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  function fmtDate(iso){
    try {
      var d = new Date(iso);
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function getPw(){ return sessionStorage.getItem(PW_KEY) || ''; }

  function adminFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, {
      'x-admin-password': getPw(),
      'Content-Type': 'application/json'
    });
    return fetch(url, opts);
  }

  function showPanel(name){
    document.getElementById('panelList').classList.toggle('active', name === 'list');
    document.getElementById('panelThread').classList.toggle('active', name === 'thread');
  }

  // ---------------- Login ----------------
  async function tryLogin(pw){
    var res = await fetch(LIST_API, { headers: { 'x-admin-password': pw } });
    return res.ok;
  }

  document.getElementById('loginBtn').addEventListener('click', async function(){
    var btn = this;
    var pw = document.getElementById('passwordInput').value;
    var errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Checking…';
    var ok = await tryLogin(pw);
    btn.disabled = false; btn.textContent = 'Log In';
    if (!ok) { errEl.style.display = 'block'; return; }
    sessionStorage.setItem(PW_KEY, pw);
    enterApp();
  });
  document.getElementById('passwordInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    sessionStorage.removeItem(PW_KEY);
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  });

  function enterApp(){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadTickets();
  }

  // ---------------- List view ----------------
  document.getElementById('filters').addEventListener('click', function(e){
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentStatusFilter = btn.getAttribute('data-status') || '';
    loadTickets();
  });
  document.getElementById('categoryFilter').addEventListener('change', function(){
    currentCategoryFilter = this.value;
    loadTickets();
  });
  document.getElementById('priorityFilter').addEventListener('change', function(){
    currentPriorityFilter = this.value;
    loadTickets();
  });

  async function loadTickets(){
    var qs = [];
    if (currentStatusFilter) qs.push('status=' + encodeURIComponent(currentStatusFilter));
    if (currentCategoryFilter) qs.push('category=' + encodeURIComponent(currentCategoryFilter));
    if (currentPriorityFilter) qs.push('priority=' + encodeURIComponent(currentPriorityFilter));
    var url = LIST_API + (qs.length ? '?' + qs.join('&') : '');
    var res = await adminFetch(url);
    if (res.status === 401) { document.getElementById('logoutBtn').click(); return; }
    var data = await res.json();
    if (!res.ok) { toast(data.error || 'Failed to load tickets', true); return; }
    renderTicketList(data.tickets || []);
  }

  function renderTicketList(tickets){
    var listEl = document.getElementById('ticketList');
    var emptyEl = document.getElementById('emptyState');
    listEl.innerHTML = '';
    if (tickets.length === 0) { emptyEl.style.display = 'block'; return; }
    emptyEl.style.display = 'none';

    tickets.forEach(function(t){
      var who = t.client_name ? (t.client_name + ' — ' + t.client_email) : t.client_email;
      if (t.company_name) who += ' (' + t.company_name + ')';
      var card = document.createElement('div');
      card.className = 'ticket-card';
      card.innerHTML =
        '<div class="ticket-top">' +
          '<div class="ticket-subject">' + esc(t.subject) + '</div>' +
          '<span class="badge status-' + esc(t.status) + '">' + esc(STATUS_LABELS[t.status] || t.status) + '</span>' +
        '</div>' +
        '<div class="ticket-who">' + esc(who) + '</div>' +
        '<div class="ticket-meta">' +
          '<span>' + esc(CATEGORY_LABELS[t.category] || t.category) + '</span>' +
          '<span class="badge priority-' + esc(t.priority || 'medium') + '">' + esc(PRIORITY_LABELS[t.priority] || 'Medium') + '</span>' +
          '<span>&middot; Updated ' + esc(fmtDate(t.updated_at)) + '</span>' +
        '</div>';
      card.addEventListener('click', function(){ openThread(t.id); });
      listEl.appendChild(card);
    });
  }

  // ---------------- Thread view ----------------
  async function openThread(id){
    currentTicketId = id;
    var res = await adminFetch(THREAD_API + '?id=' + encodeURIComponent(id));
    if (res.status === 401) { document.getElementById('logoutBtn').click(); return; }
    var data = await res.json();
    if (!res.ok) { toast(data.error || 'Failed to load ticket', true); return; }
    renderThread(data.ticket, data.messages || []);
    showPanel('thread');
  }

  function renderThread(ticket, messages){
    document.getElementById('threadSubject').textContent = ticket.subject;
    var who = ticket.client_name ? (ticket.client_name + ' — ' + ticket.client_email) : ticket.client_email;
    if (ticket.company_name) who += ' (' + ticket.company_name + ')';
    document.getElementById('threadMeta').textContent = who + ' · ' + (CATEGORY_LABELS[ticket.category] || ticket.category);
    document.getElementById('statusSelect').value = ticket.status;
    document.getElementById('prioritySelect').value = ticket.priority || 'medium';

    var msgsEl = document.getElementById('messagesList');
    msgsEl.innerHTML = '';
    messages.forEach(function(m){
      var bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + (m.sender_type === 'admin' ? 'admin' : 'client');
      var attachmentHtml = m.attachment_url
        ? '<div class="attachment-link"><a href="' + esc(m.attachment_url) + '" target="_blank" rel="noopener">📎 ' + esc(m.attachment_name || 'Attachment') + '</a></div>'
        : '';
      bubble.innerHTML =
        '<div class="who">' + (m.sender_type === 'admin' ? 'You (Click4Tech Support)' : esc(m.sender_name || 'Client')) + '</div>' +
        '<div>' + esc(m.body).replace(/\n/g, '<br>') + '</div>' +
        attachmentHtml +
        '<div class="when">' + esc(fmtDate(m.created_at)) + '</div>';
      msgsEl.appendChild(bubble);
    });
    document.getElementById('replyText').value = '';
  }

  document.getElementById('statusSelect').addEventListener('change', async function(){
    var status = this.value;
    var res = await adminFetch(STATUS_API, {
      method: 'POST',
      body: JSON.stringify({ ticket_id: currentTicketId, status: status })
    });
    var data = await res.json();
    if (!res.ok) { toast(data.error || 'Failed to update status', true); return; }
    toast('Status updated to ' + (STATUS_LABELS[status] || status));
  });

  document.getElementById('prioritySelect').addEventListener('change', async function(){
    var priority = this.value;
    var res = await adminFetch(STATUS_API, {
      method: 'POST',
      body: JSON.stringify({ ticket_id: currentTicketId, priority: priority })
    });
    var data = await res.json();
    if (!res.ok) { toast(data.error || 'Failed to update priority', true); return; }
    toast('Priority updated to ' + (PRIORITY_LABELS[priority] || priority));
  });

  document.getElementById('replySendBtn').addEventListener('click', async function(){
    var btn = this;
    var text = document.getElementById('replyText').value.trim();
    if (!text) { toast('Type a reply first.', true); return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    var res = await adminFetch(REPLY_API, {
      method: 'POST',
      body: JSON.stringify({ ticket_id: currentTicketId, message: text })
    });
    btn.disabled = false; btn.textContent = 'Send Reply';
    var data = await res.json();
    if (!res.ok) { toast(data.error || 'Failed to send reply', true); return; }
    openThread(currentTicketId);
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    showPanel('list');
    loadTickets();
  });

  // ---------------- Boot ----------------
  (function boot(){
    var pw = getPw();
    if (!pw) return; // stays on login screen
    tryLogin(pw).then(function(ok){
      if (ok) enterApp();
    });
  })();
})();
</script>
</body>
</html>
