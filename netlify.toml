[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ITCC Penampang shopping mall site, served at click4techsolutions.com/itcc
# (the site itself lives in the separate itccmall Netlify project)
[[redirects]]
  from = "/itcc"
  to = "https://itccmall.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/itcc/*"
  to = "https://itccmall.netlify.app/:splat"
  status = 200
  force = true
